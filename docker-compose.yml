services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bocado
      POSTGRES_PASSWORD: bocado
      POSTGRES_DB: bocado
    volumes:
      - bocado-db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bocado']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: npm run prisma:migrate:deploy --workspace backend
    environment:
      DATABASE_URL: postgresql://bocado:bocado@db:5432/bocado
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bocado:bocado@db:5432/bocado
      JWT_ACCESS_SECRET: troque-por-um-segredo-gerado
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /data/storage
      PORT: 3000
      NODE_ENV: production
      LOG_FORMAT: json
    volumes:
      - bocado-storage:/data/storage
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  bocado-db-data:
  bocado-storage:
